<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 저녁 메뉴 추천</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --primary-hover: #ee5253;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --sub-text: #636e72;
            --accent-color: #feca57;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1e272e;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--sub-text);
            margin-bottom: 30px;
        }

        .display-area {
            background-color: #fff9f0;
            border: 2px dashed #ffeaa7;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 30px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .emoji-box {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }

        .menu-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3436;
            min-height: 2rem;
        }

        .category-tag {
            display: inline-block;
            padding: 4px 12px;
            background-color: #ffeaa7;
            color: #d63031;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 12px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .category-tag.show {
            opacity: 1;
        }

        .btn-recommend {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.2s ease;
            width: 100%;
            outline: none;
        }

        .btn-recommend:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.5);
        }

        .btn-recommend:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        .history {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: var(--sub-text);
        }

        .history span {
            font-weight: bold;
            color: var(--primary-color);
        }

        .bounce {
            animation: bounce 0.4s ease;
        }

        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍱 오늘 저녁 뭐 먹지?</h1>
        <p class="subtitle">결정이 어려울 땐 버튼을 눌러보세요!</p>

        <div class="display-area">
            <div id="emoji" class="emoji-box">❓</div>
            <div id="menu" class="menu-name">버튼을 눌러주세요</div>
            <div id="category" class="category-tag">한식</div>
        </div>

        <button class="btn-recommend" onclick="pickRandomMenu()">저녁 메뉴 추천</button>

        <div class="history" id="history-box" style="display: none;">
            방금 고른 메뉴: <span id="last-menu">-</span>
        </div>
    </div>

    <script>
        const menuList = [
            // 한식
            { name: "김치찌개", emoji: "🍲", category: "한식" },
            { name: "된장찌개", emoji: "🥘", category: "한식" },
            { name: "삼겹살", emoji: "🥓", category: "한식" },
            { name: "비빔밥", emoji: "🥗", category: "한식" },
            { name: "불고기", emoji: "🥩", category: "한식" },
            { name: "떡볶이", emoji: "🍢", category: "분식" },
            { name: "치킨", emoji: "🍗", category: "야식/한식" },
            { name: "족발/보쌈", emoji: "🍖", category: "한식" },

            // 일식
            { name: "초밥", emoji: "🍣", category: "일식" },
            { name: "라멘", emoji: "🍜", category: "일식" },
            { name: "돈가스", emoji: "🍱", category: "일식" },
            { name: "우동", emoji: "🍲", category: "일식" },

            // 중식
            { name: "짜장면", emoji: "🍜", category: "중식" },
            { name: "짬뽕", emoji: "🍲", category: "중식" },
            { name: "탕수육", emoji: "🥟", category: "중식" },
            { name: "마라탕", emoji: "🥘", category: "중식" },

            // 양식
            { name: "피자", emoji: "🍕", category: "양식" },
            { name: "파스타", emoji: "🍝", category: "양식" },
            { name: "햄버거", emoji: "🍔", category: "양식" },
            { name: "스테이크", emoji: "🥩", category: "양식" },

            // 기타/아시안
            { name: "쌀국수", emoji: "🍜", category: "아시안" },
            { name: "카레", emoji: "🍛", category: "아시안" },
            { name: "타코", emoji: "🌮", category: "멕시칸" },
            { name: "샌드위치", emoji: "🥪", category: "간식/양식" }
        ];

        let isAnimating = false;

        function pickRandomMenu() {
            if (isAnimating) return;
            isAnimating = true;

            const emojiEl = document.getElementById("emoji");
            const menuEl = document.getElementById("menu");
            const categoryEl = document.getElementById("category");
            const historyBox = document.getElementById("history-box");
            const lastMenuEl = document.getElementById("last-menu");

            if (menuEl.innerText !== "버튼을 눌러주세요") {
                lastMenuEl.innerText = menuEl.innerText;
                historyBox.style.display = "block";
            }

            categoryEl.classList.remove("show");

            // 고르는 중 효과 (슬롯머신 모션)
            let counter = 0;
            const interval = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * menuList.length);
                emojiEl.innerText = menuList[tempIndex].emoji;
                menuEl.innerText = menuList[tempIndex].name;
                counter++;

                if (counter > 10) {
                    clearInterval(interval);
                    
                    // 최종 메뉴 결정
                    const finalIndex = Math.floor(Math.random() * menuList.length);
                    const selected = menuList[finalIndex];

                    emojiEl.innerText = selected.emoji;
                    menuEl.innerText = selected.name;
                    categoryEl.innerText = selected.category;

                    // 애니메이션 효과
                    emojiEl.classList.remove("bounce");
                    void emojiEl.offsetWidth;
                    emojiEl.classList.add("bounce");

                    categoryEl.classList.add("show");

                    isAnimating = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
